name: Stage 8 AI Evaluation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage8-ai-evaluation.yml"
      - "api/stage8-ai-evaluation.ts"
      - "src/ai-analyst/**"
      - "scripts/stage8-groq-evaluation.ts"
      - "supabase/migrations/005_stage8_ai_assessments.sql"
      - "supabase/migrations/006_stage8_ai_evaluation_runs.sql"

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify Stage 7 frozen detector is unchanged
        shell: bash
        run: |
          test "$(git hash-object src/domain/deterministic-verifier.ts)" = "bcb18f5fa7e41083aca4208fc7c95bbb3288fa84"
          test "$(git hash-object src/domain/evidence-verification.ts)" = "8ddc19fe96fd73111e7d047bd8367209d2659dcb"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install repository dependencies
        run: npm install

      - name: Run Stage 8 authority tests
        run: npx vitest run src/ai-analyst/ai-analyst.test.ts --reporter=verbose

      - name: Request short-lived Groq evaluation credential
        shell: bash
        run: |
          response=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=thirdsight-stage8-groq")
          token=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$token"
          echo "THIRDSIGHT_STAGE8_GROQ_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install evaluation runner
        run: npm install --no-save tsx

      - name: Run fresh held-out AI OFF / AI ON evaluation
        run: npx tsx scripts/stage8-groq-evaluation.ts

      - name: Validate Stage 8 evaluation
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const body=JSON.parse(fs.readFileSync("stage8-ai-evaluation.json","utf8"));
          if(!body.ok) throw new Error(JSON.stringify(body));
          if(body.frozenDetector!=="stage7-v1-frozen"||body.detectorModified!==false) throw new Error("Frozen deterministic detector invariant failed");
          if(body.factualEvidenceMutatedByAi!==false) throw new Error("AI mutated factual evidence");
          if(body.rawPayloadsSentToAi!==false||body.piiValuesSentToAi!==false) throw new Error("AI privacy boundary failed");
          if(body.benchmarkId!=="stage8-fresh-v2") throw new Error("Expected fresh Stage 8 benchmark v2");
          if(body.heldOutCases!==16) throw new Error("Expected exactly 16 fresh held-out ambiguous cases");
          if(body.provider!=="groq-cloud"||body.model!=="openai/gpt-oss-120b@groq") throw new Error("Unexpected AI provider/model");
          if(body.strictStructuredOutput!==true) throw new Error("Groq strict structured output was not active");
          if(body.aiOn?.harmfulResponseRate!==0) throw new Error("AI harmful-response rate must remain zero");
          console.log(JSON.stringify({
            benchmarkId:body.benchmarkId,
            model:body.model,
            aiOff:body.aiOff,
            aiOn:body.aiOn,
            improvement:body.improvement,
            surfaceProminently:body.surfaceProminently,
            surfaceReason:body.surfaceReason,
            acceptedAssessments:body.acceptedAssessments,
            rejectedAssessments:body.rejectedAssessments
          },null,2));
          NODE

      - name: Request short-lived GitHub OIDC persistence credential
        shell: bash
        run: |
          response=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=thirdsight-stage8-local-ai")
          token=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$token"
          echo "THIRDSIGHT_STAGE8_INGEST_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Persist factual evidence and advisory assessments separately
        shell: bash
        run: |
          code=$(curl -sS -o stage8-persistence.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $THIRDSIGHT_STAGE8_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @stage8-ai-ingest.json \
            https://rxqlqirmmkhcavocbzcn.supabase.co/functions/v1/thirdsight-stage8-ingest)
          cat stage8-persistence.json
          test "$code" = "200"
          node - <<'NODE'
          const fs=require("fs");
          const body=JSON.parse(fs.readFileSync("stage8-persistence.json","utf8"));
          if(!body.ok||body.evidenceRows!==16||body.assessmentRows!==16) throw new Error("Stage 8 persistence verification failed");
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage8-ai-evaluation-groq
          path: |
            stage8-ai-evaluation.json
            stage8-ai-ingest.json
            stage8-persistence.json
