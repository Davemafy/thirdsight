name: Publish Stage 6 Global 1000-Site Results

on:
  workflow_run:
    workflows: ["Stage 6 Global 1000-Site Discovery"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage6-global1000-publish.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve completed benchmark run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            run_id="$EVENT_RUN_ID"
          else
            run_id=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/stage6-global1000-discovery.yml/runs"               -f branch=main -f event=push -f per_page=10               --jq '.workflow_runs[0].id')
          fi

          test -n "$run_id"
          echo "Resolved benchmark run: $run_id"

          for i in {1..120}; do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.status')
            if [ "$status" = "completed" ]; then
              break
            fi
            echo "Benchmark status: $status"
            sleep 10
          done

          status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.status')
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '.conclusion')
          echo "Benchmark completed: status=$status conclusion=$conclusion"
          test "$status" = "completed"
          test "$conclusion" = "success"
          echo "BENCHMARK_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Download completed benchmark artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/global1000
          gh run download "$BENCHMARK_RUN_ID" -R "${{ github.repository }}" -n stage6-global1000-passive-discovery -D /tmp/global1000

      - name: Publish benchmark report and compact summary
        run: |
          cp /tmp/global1000/stage6-global1000-discovery.md docs/stage6-global1000-benchmark.md
          node - <<'NODE'
          const fs=require("fs");
          const input=JSON.parse(fs.readFileSync("/tmp/global1000/stage6-global1000-discovery.json","utf8"));
          const summary={
            schemaVersion:"thirdsight-global1000-summary.v1",
            workflowRunId:process.env.BENCHMARK_RUN_ID,
            runId:input.runId,
            generatedAt:input.generatedAt,
            mode:input.mode,
            source:input.source,
            thesis:input.thesis,
            summary:input.summary,
            evidenceSemantics:input.evidenceSemantics,
            safety:input.safety,
            topDestinations:input.topDestinations,
          };
          fs.writeFileSync("docs/stage6-global1000-summary.json",JSON.stringify(summary,null,2)+"\n");
          NODE

      - name: Commit immutable benchmark result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stage6-global1000-benchmark.md docs/stage6-global1000-summary.json
          if git diff --cached --quiet; then
            echo "No benchmark result change to publish."
            exit 0
          fi
          git commit -m "docs(stage6): publish 1000-site benchmark result (run $BENCHMARK_RUN_ID)"
          git push origin HEAD:main
