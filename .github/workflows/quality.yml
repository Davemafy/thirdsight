name: Quality

on:
  push:
    branches:
      - main
      - feat/browser-evidence-adapter
      - design/evidence-first-console
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install dependencies
        run: npm install

      - name: Run quality gate
        run: npm run quality
