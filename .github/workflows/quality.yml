name: Quality

on:
  push:
    branches:
      - main
      - feat/browser-evidence-adapter
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'

      - name: Install root dependencies
        run: npm install

      - name: Run ThirdSight quality gate
        run: npm run quality

      - name: Install CEDAR dependencies
        run: npm ci --prefix services/cedar-commerce

      - name: Verify CEDAR
        run: |
          npm --prefix services/cedar-commerce run typecheck
          npm --prefix services/cedar-commerce test

      - name: Install Partner Lab dependencies
        run: npm ci --prefix services/partner-lab

      - name: Verify Partner Lab
        run: |
          npm --prefix services/partner-lab run typecheck
          npm --prefix services/partner-lab test
