name: Konga observation smoke

on:
  push:
    branches:
      - spike/browser-enforcement
    paths:
      - '.github/workflows/konga-observation-smoke.yml'
      - 'spikes/browser-enforcement-extension/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  konga-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout spike branch
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser test dependency
        working-directory: spikes/browser-enforcement-extension/ci
        run: npm install

      - name: Install Playwright Chromium
        working-directory: spikes/browser-enforcement-extension/ci
        run: npx playwright install --with-deps chromium

      - name: Observe public Konga Nigeria traffic
        env:
          THIRDSIGHT_KONGA_REPORT: spikes/browser-enforcement-extension/ci/konga-observation-report.json
        run: xvfb-run -a node spikes/browser-enforcement-extension/ci/konga-observation-smoke.mjs

      - name: Upload observation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: konga-observation-smoke-evidence
          if-no-files-found: warn
          path: spikes/browser-enforcement-extension/ci/konga-observation-report.json
