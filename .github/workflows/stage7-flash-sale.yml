name: Stage 7 Flash Sale

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage7-flash-sale.yml"
      - "api/stage7-flash-sale.ts"
      - "src/domain/evidence.ts"
      - "src/domain/evidence-verification.ts"
      - "src/domain/deterministic-verifier.ts"
      - "src/infrastructure/browser-evidence/**"
      - "src/infrastructure/evidence-history/**"
      - "src/infrastructure/auth/github-actions-oidc.ts"

permissions:
  contents: read
  id-token: write

jobs:
  flash-sale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Request short-lived GitHub OIDC credential
        shell: bash
        run: |
          response=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=thirdsight-stage7-flash-sale")
          token=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$token"
          echo "THIRDSIGHT_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run persisted 10x flash-sale proof
        shell: bash
        run: |
          for i in {1..60}; do
            code=$(curl -sS -o stage7-flash-sale.json -w "%{http_code}" -X POST -H "Authorization: Bearer $THIRDSIGHT_OIDC_TOKEN" https://thirdsight-five.vercel.app/api/stage7-flash-sale || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          node - <<'NODE'
          const fs=require("fs");
          const body=JSON.parse(fs.readFileSync("stage7-flash-sale.json","utf8"));
          if(!body.ok) throw new Error(JSON.stringify(body));
          if(body.multiplier!==10) throw new Error("Expected 10x spike");
          if(body.falseAlarms!==0) throw new Error("Legitimate flash sale produced a false alarm");
          if(body.persistedRecords!==50) throw new Error("Expected 50 persisted flash-sale records");
          if(body.decisions?.ALLOW!==50) throw new Error("Every flash-sale request must ALLOW");
          if(body.whyCorrelation!=="BUSINESS_OBJECT_HASH") throw new Error("Expected object-level WHY correlation");
          console.log(JSON.stringify(body));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7-flash-sale-proof
          path: stage7-flash-sale.json
