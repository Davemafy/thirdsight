name: Stage 7 Shadow Integration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage7-shadow.yml"
      - "api/stage7-shadow.ts"
      - "src/domain/deterministic-verifier.ts"
      - "src/infrastructure/browser-evidence/**"
      - "src/infrastructure/evidence-history/**"
      - "src/infrastructure/auth/github-actions-oidc.ts"

permissions:
  contents: read
  id-token: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Request short-lived GitHub OIDC credential
        shell: bash
        run: |
          response=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=thirdsight-stage7-shadow")
          token=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$token"
          echo "THIRDSIGHT_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run persisted opaque-shadow proof
        shell: bash
        run: |
          for i in {1..60}; do
            code=$(curl -sS -o stage7-shadow.json -w "%{http_code}" -X POST -H "Authorization: Bearer $THIRDSIGHT_OIDC_TOKEN" https://thirdsight-five.vercel.app/api/stage7-shadow || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          node - <<'NODE'
          const fs=require("fs");
          const body=JSON.parse(fs.readFileSync("stage7-shadow.json","utf8"));
          if(!body.ok) throw new Error(JSON.stringify(body));
          if(body.finding!=="SHADOW_INTEGRATION"||body.decision!=="OBSERVE") throw new Error("Expected SHADOW_INTEGRATION → OBSERVE");
          if(body.integrationResolution!=="UNRESOLVED") throw new Error("Shadow integration identity must remain unresolved");
          if(body.dataCategories!==null||body.payloadSemantics!=="UNKNOWN") throw new Error("Opaque payload semantics were invented");
          if(body.outcome!==null) throw new Error("Shadow observation must not claim prevention/detection outcome");
          console.log(JSON.stringify(body));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7-shadow-proof
          path: stage7-shadow.json
