name: Stage 7 Stale CRM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage7-stale-crm.yml"
      - "api/stage7-stale-crm.ts"
      - "src/domain/deterministic-verifier.ts"
      - "src/infrastructure/db-audit/**"
      - "src/infrastructure/evidence-history/**"
      - "src/infrastructure/auth/github-actions-oidc.ts"
      - "supabase/migrations/003_stage7_scenarios.sql"

permissions:
  contents: read
  id-token: write

jobs:
  stale-crm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Request short-lived GitHub OIDC credential
        shell: bash
        run: |
          response=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=thirdsight-stage7-stale-crm")
          token=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$token"
          echo "THIRDSIGHT_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run persisted stale CRM proof
        shell: bash
        run: |
          for i in {1..60}; do
            code=$(curl -sS -o stage7-stale-crm.json -w "%{http_code}" -X POST -H "Authorization: Bearer $THIRDSIGHT_OIDC_TOKEN" https://thirdsight-five.vercel.app/api/stage7-stale-crm || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          node - <<'NODE'
          const fs=require("fs");
          const body=JSON.parse(fs.readFileSync("stage7-stale-crm.json","utf8"));
          if(!body.ok) throw new Error(JSON.stringify(body));
          if(body.boundary!=="db-audit") throw new Error("Expected DB audit evidence");
          if(body.finding!=="STALE_INTEGRATION"||body.decision!=="ISOLATE") throw new Error("Expected STALE_INTEGRATION → ISOLATE");
          if(body.outcome!=="DETECTED") throw new Error("Already-observed DB read must be DETECTED, not PREVENTED");
          if(body.credential?.status!=="REVOKED") throw new Error("Credential was not isolated");
          if(body.gatewayTrafficObserved!==false) throw new Error("Scenario must bypass gateway visibility");
          console.log(JSON.stringify(body));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7-stale-crm-proof
          path: stage7-stale-crm.json
