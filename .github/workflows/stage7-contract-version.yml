name: Stage 7 Contract Version

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage7-contract-version.yml"
      - "api/stage7-contract-version.ts"
      - "src/domain/evidence-verification.ts"
      - "src/domain/deterministic-verifier.ts"
      - "src/infrastructure/browser-evidence/**"
      - "src/infrastructure/evidence-history/**"
      - "src/infrastructure/auth/github-actions-oidc.ts"
      - "supabase/migrations/004_stage7_contract_versions.sql"

permissions:
  contents: read
  id-token: write

jobs:
  contract-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Request short-lived GitHub OIDC credential
        shell: bash
        run: |
          response=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=thirdsight-stage7-contract-version")
          token=$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          echo "::add-mask::$token"
          echo "THIRDSIGHT_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run persisted contract-version proof
        shell: bash
        run: |
          for i in {1..60}; do
            code=$(curl -sS -o stage7-contract-version.json -w "%{http_code}" -X POST -H "Authorization: Bearer $THIRDSIGHT_OIDC_TOKEN" https://thirdsight-five.vercel.app/api/stage7-contract-version || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          node - <<'NODE'
          const fs=require("fs");
          const body=JSON.parse(fs.readFileSync("stage7-contract-version.json","utf8"));
          if(!body.ok) throw new Error(JSON.stringify(body));
          if(body.before?.contractVersion!=="4") throw new Error("Historical record must bind to v4");
          if(body.before?.decision!=="CONSTRAIN"||!body.before?.findings?.includes("SCOPE_DRIFT")) throw new Error("New field must drift before v5");
          if(body.after?.contractVersion!=="5") throw new Error("Post-change record must bind to v5");
          if(body.after?.decision!=="ALLOW"||body.after?.findings?.length!==0) throw new Error("Approved v5 field must ALLOW");
          console.log(JSON.stringify(body));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage7-contract-version-proof
          path: stage7-contract-version.json
